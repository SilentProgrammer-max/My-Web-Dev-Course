<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: rgb(19, 19, 19);
      }
      .card {
        display: flex;
        border: 2px solid rgb(26, 25, 25);
        width: 1000px;
        justify-content: center;
        align-items: center;
        border-radius: 15px;
        background-color: rgb(19, 19, 19);
        color: white;
        margin: 8px;
        padding: 5px 0 0 0px;
        font-family: "Roboto", "Arial", sans-serif;
        font-size: 15px;
      }
      .card:hover{
        background-color: rgb(27, 27, 27);
      }
      .image img {
        width: 200px;
        height: 120px;
        display: flex;
        border-radius: 12px;
        border: transparent;
      }
      .image img:hover{
        border: 2px solid rgb(26, 25, 25);
      }
      .text h1,
      p {
        padding: 8px 10px 1px 0px;
      }

      .image {
        position: relative;
        padding: 0px 50px 0px 0px;
        margin: auto;
      }
      .image .capsule {
        position: absolute;
        bottom: 4px;
        z-index: 12;
        right: 56px;
        background: #242020;
        opacity: 0.9;
        color: white;
        padding: 3px;
        border-radius: 5px;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="card">
        <div class="image">
          <img
            src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEcCPYBEIoBSFXyq4qpAw4IARUAAIhCGAFwAcABBg==&rs=AOn4CLACwWOixJVrKLFindK92kYMgTcQbw"
            alt=""
          />
          <div class="capsule">10:00</div>
        </div>
        <div class="text">
          <h1>Introduction to Backend | Sigma Web Dev video #1</h1>
          <p>CodeWithHarry . 100 views . 2 months ago</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
